<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 280px; padding: 15px; font-family: Arial, sans-serif; }
    input, button { width: 100%; margin-top: 10px; padding: 8px; box-sizing: border-box; }
    h3 { margin-bottom: 5px; }
    .hint { font-size: 11px; color: #666; margin: 4px 0 0; }
    #urlList { list-style: none; padding: 0; margin: 10px 0 0; max-height: 150px; overflow-y: auto; }
    #urlList li { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; margin-top: 6px; font-size: 12px; word-break: break-all; }
    #urlList button { width: auto; margin: 0 0 0 8px; padding: 2px 8px; flex-shrink: 0; }
  </style>
</head>
<body>
  <h3>Allowed Websites</h3>
  <p class="hint">The filter only runs on sites listed here. Enter a domain (e.g. example.com) or a match pattern (e.g. *://*.example.com/*).</p>
  <input type="text" id="urlInput" placeholder="example.com">
  <button id="addUrlBtn">Add Website</button>
  <button id="addCurrentBtn">Add This Website</button>
  <p id="urlStatus"></p>
  <ul id="urlList"></ul>

  <hr style="margin: 15px 0;">
  <h3>Gemini Nano Setup</h3>
  <p class="hint">Enable these flags to use on-device Gemini Nano.</p>
  <button id="flagOptimizationBtn"><span id="optIcon">❓</span> Optimization Guide (Set to: Enabled BypassPerfRequirement)</button>
  <button id="flagPromptApiBtn"><span id="promptIcon">❓</span> Prompt API for Gemini Nano (Set to: Enabled)</button>
  <button id="relaunchChromeBtn">Restart Chrome</button>

  <script type="module" src="popup.js"></script>
</body>
</html>
